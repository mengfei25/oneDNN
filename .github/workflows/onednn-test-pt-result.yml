name: oneDNN test_pt result

# Event-driven callback: the torch-xpu-ops acceptance run reports its result via
# repository_dispatch (type `acceptance-result`); this finalizes the matching
# check run on the PR head commit. No polling.

on:
  repository_dispatch:
    types: [acceptance-result]

permissions:
  checks: write

jobs:
  finalize:
    name: finalize acceptance check
    if: ${{ github.repository_owner == 'mengfei25' }}
    runs-on: ubuntu-latest
    steps:
      - name: Finalize check run
        uses: actions/github-script@v7
        with:
          script: |
            const p = context.payload.client_payload || {};
            if (!p.check_id) { core.info('No check_id in payload; nothing to finalize.'); return; }
            const map = {
              success: 'success', failure: 'failure', cancelled: 'cancelled',
              timed_out: 'timed_out', neutral: 'neutral', skipped: 'skipped',
            };
            const conclusion = map[p.conclusion] || 'failure';
            const runUrl = p.run_url || '';
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(p.check_id),
              status: 'completed',
              conclusion,
              completed_at: new Date().toISOString(),
              details_url: runUrl,
              output: {
                title: `Acceptance comparison (${p.pattern || ''}): ${p.conclusion || conclusion}`,
                summary: [
                  `**Result:** \`${conclusion}\``,
                  `**Component:** \`${p.component || ''}\``,
                  `**Pattern:** \`${p.pattern || ''}\``,
                  `**Target:** \`${p.target || ''}\``,
                  `**Baseline:** \`${p.baseline || ''}\``,
                  '',
                  runUrl ? `[View run](${runUrl})` : '',
                ].join('\n'),
              },
            });
