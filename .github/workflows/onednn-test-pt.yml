name: oneDNN test_pt

# Comment a `make test_pt` command on a PR to run the torch-xpu-ops acceptance
# comparison (`acceptance_ondemand.yml`). This creates a **check run** on the PR
# head commit (shows in the PR "Checks" tab; can be a required merge gate) and
# dispatches the run, then exits. The acceptance run reports its result back via
# repository_dispatch, and `onednn-test-pt-result.yml` finalizes the check.
# Event-driven, no polling.
#
# Command syntax (comment on the PR):
#   make test_pt[_ut|_e2e|_smoke] [key=value ...]
#     scope     : test_pt (UT+E2E) | test_pt_ut (UT only) | test_pt_e2e (E2E only) | test_pt_smoke (smoke only)
#     overrides : python= pytorch= torch_xpu_ops= target= baseline=
#   default to the PR head/base. Examples:
#     make test_pt
#     make test_pt_ut python=3.12
#     make test_pt_e2e target=<sha> baseline=<sha>
#     make test_pt_smoke

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: onednn-test-pt-${{ github.event.issue.number }}
  cancel-in-progress: true

env:
  XPU_OPS_REPO: mengfei25/torch-xpu-ops
  XPU_OPS_WORKFLOW: acceptance_ondemand.yml
  XPU_OPS_REF: main
  CHECK_PREFIX: acceptance

jobs:
  onednn_test_pt:
    name: onednn_test_pt
    if: >-
      github.repository_owner == 'mengfei25' &&
      github.event.issue.pull_request &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      startsWith(github.event.comment.body, 'make test_pt')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Acknowledge command
        run: |
          gh api -X POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=rocket || true

      - name: Parse command
        id: cmd
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        uses: actions/github-script@v7
        with:
          script: |
            const body = (process.env.COMMENT_BODY || '').trim();
            // Syntax: make test_pt[_ut|_e2e|_smoke] [key=value ...]
            const m = body.match(/^make\s+(test_pt(?:_ut|_e2e|_smoke)?)\b([\s\S]*)$/i);
            if (!m) { core.setOutput('run', 'false'); return; }
            const pattern = m[1].toLowerCase(); // test_pt | test_pt_ut | test_pt_e2e | test_pt_smoke
            const opts = {
              python: '3.10',
              pytorch: 'main',
              torch_xpu_ops: 'main',
              target: '',
              baseline: '',
            };
            for (const tok of m[2].trim().split(/\s+/).filter(Boolean)) {
              const kv = tok.match(/^([a-zA-Z_]+)=(.+)$/);
              if (kv && kv[1].toLowerCase() in opts) opts[kv[1].toLowerCase()] = kv[2];
            }
            core.setOutput('run', 'true');
            core.setOutput('pattern', pattern);
            for (const [k, v] of Object.entries(opts)) core.setOutput(k, v);

      - name: Create check run
        id: check
        if: steps.cmd.outputs.run == 'true'
        env:
          PATTERN: ${{ steps.cmd.outputs.pattern }}
          TARGET_OVERRIDE: ${{ steps.cmd.outputs.target }}
          BASELINE_OVERRIDE: ${{ steps.cmd.outputs.baseline }}
        uses: actions/github-script@v7
        with:
          script: |
            const comp = 'onednn';
            const pattern = process.env.PATTERN;
            const { owner, repo } = context.repo;
            const pr = (await github.rest.pulls.get({
              owner, repo, pull_number: context.payload.issue.number,
            })).data;
            const shortSha = (s) => s.slice(0, 7);
            const target = process.env.TARGET_OVERRIDE || shortSha(pr.head.sha);
            const baseline = process.env.BASELINE_OVERRIDE || shortSha(pr.base.sha);
            const xpuRepo = process.env.XPU_OPS_REPO;             // owner/name of the repo running the job
            const xpuName = xpuRepo.split('/')[1];
            const workflowUrl = `https://github.com/${xpuRepo}/actions/workflows/${process.env.XPU_OPS_WORKFLOW}`;
            // Name carries the other repo so the check clearly runs in `xpuRepo`.
            // Always create a fresh in-progress run (updating a completed run keeps
            // its old conclusion), then demote older acceptance checks so only the
            // latest stays active. `prefix` keeps the demote match stable.
            const prefix = `${process.env.CHECK_PREFIX} / ${comp}`;
            const name = `${prefix} (${xpuName})`;
            const check = (await github.rest.checks.create({
              owner, repo, name, head_sha: pr.head.sha,
              status: 'in_progress', started_at: new Date().toISOString(),
              details_url: workflowUrl,
              output: {
                title: `Dispatching acceptance comparison (${pattern}) in ${xpuRepo}`,
                summary: `Preparing **${comp}** (${pattern}) target vs baseline acceptance run in [\`${xpuRepo}\`](${workflowUrl})…`,
              },
            })).data;
            const all = (await github.rest.checks.listForRef({
              owner, repo, ref: pr.head.sha, per_page: 100,
            })).data.check_runs;
            for (const c of all) {
              if (c.id !== check.id && c.name.startsWith(prefix)) {
                await github.rest.checks.update({
                  owner, repo, check_run_id: c.id,
                  status: 'completed', conclusion: 'neutral',
                  output: { title: 'Superseded', summary: 'Superseded by the latest acceptance run.' },
                });
              }
            }
            core.setOutput('check_id', check.id);
            core.setOutput('check_name', name);
            core.setOutput('head_sha', shortSha(pr.head.sha));
            core.setOutput('component', comp);
            core.setOutput('pattern', pattern);
            core.setOutput('target_version', target);
            core.setOutput('baseline_version', baseline);

      - name: Dispatch acceptance workflow
        id: dispatch
        if: steps.cmd.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.ONEDNN_DISPATCH_TOKEN }}
          COMPONENT: ${{ steps.check.outputs.component }}
          PATTERN: ${{ steps.check.outputs.pattern }}
          PYVER: ${{ steps.cmd.outputs.python }}
          PYTORCH: ${{ steps.cmd.outputs.pytorch }}
          TXO: ${{ steps.cmd.outputs.torch_xpu_ops }}
          TARGET: ${{ steps.check.outputs.target_version }}
          BASELINE: ${{ steps.check.outputs.baseline_version }}
          CALLBACK_CHECK_ID: ${{ steps.check.outputs.check_id }}
        run: |
          # Fire-and-forget: acceptance reports its result back via
          # repository_dispatch (acceptance-result), finalized by onednn-test-pt-result.yml.
          echo "since=$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          gh workflow run "${XPU_OPS_WORKFLOW}" \
            --repo "${XPU_OPS_REPO}" \
            --ref "${XPU_OPS_REF}" \
            -f caller="onednn-pr-${PR_NUMBER}" \
            -f callback_repo="${{ github.repository }}" \
            -f callback_check_id="${CALLBACK_CHECK_ID}" \
            -f test_pattern="${PATTERN}" \
            -f python="${PYVER}" \
            -f pytorch="${PYTORCH}" \
            -f torch_xpu_ops="${TXO}" \
            -f test_component="${COMPONENT}" \
            -f target_version="${TARGET}" \
            -f baseline_version="${BASELINE}"

      - name: Locate dispatched run
        id: locate
        if: steps.cmd.outputs.run == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ONEDNN_DISPATCH_TOKEN }}
          SINCE: ${{ steps.dispatch.outputs.since }}
        run: |
          # One-shot lookup (with brief retry) for the run URL of the job we just
          # dispatched in the other repo — no waiting for completion.
          url=""
          for _ in $(seq 1 10); do
            url=$(gh run list --repo "${XPU_OPS_REPO}" --workflow "${XPU_OPS_WORKFLOW}" \
              --event workflow_dispatch --created ">=${SINCE}" \
              --limit 1 --json url --jq '.[0].url // empty' 2>/dev/null || true)
            [ -n "$url" ] && break
            sleep 3
          done
          echo "run_url=${url}" >> "$GITHUB_OUTPUT"

      - name: Link run in check
        if: steps.cmd.outputs.run == 'true' && steps.locate.outputs.run_url != ''
        env:
          RUN_URL: ${{ steps.locate.outputs.run_url }}
          CHECK_ID: ${{ steps.check.outputs.check_id }}
          COMPONENT: ${{ steps.check.outputs.component }}
          PATTERN: ${{ steps.check.outputs.pattern }}
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = process.env.RUN_URL;
            const comp = process.env.COMPONENT, pattern = process.env.PATTERN;
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(process.env.CHECK_ID),
              details_url: runUrl,
              output: {
                title: `Acceptance comparison running (${pattern})`,
                summary: `**${comp}** (${pattern}) target vs baseline acceptance run is in progress.\n\n[View the dispatched run in ${process.env.XPU_OPS_REPO}](${runUrl})`,
              },
            });
