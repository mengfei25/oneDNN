name: oneDNN test_pt

# Comment `make test_pt[...]` on a PR to dispatch the torch-xpu-ops acceptance
# run and mirror EACH of its jobs as a live commit status on this PR — so the
# dispatched run's jobs show up in the oneDNN PR checks just like they do in
# torch-xpu-ops. All integration lives here; torch-xpu-ops only needs to be
# workflow_dispatch-able (no callback plumbing on that side).
#
# Command syntax (comment on the PR):
#   make test_pt[_ut|_e2e|_smoke] [key=value ...]
#     scope     : test_pt (UT+E2E) | test_pt_ut (UT only) | test_pt_e2e (E2E only) | test_pt_smoke (smoke only)
#     overrides : python= pytorch= torch_xpu_ops= target= baseline=
#   default to the PR head/base. Examples:
#     make test_pt
#     make test_pt_ut python=3.12
#     make test_pt_e2e target=<sha> baseline=<sha>
#     make test_pt_smoke

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  statuses: write
  pull-requests: write

concurrency:
  group: onednn-test-pt-${{ github.event.issue.number }}
  cancel-in-progress: true

env:
  XPU_OPS_REPO: mengfei25/torch-xpu-ops
  XPU_OPS_WORKFLOW: acceptance_ondemand.yml
  XPU_OPS_REF: main
  DISPATCH_CONTEXT: 'oneDNN: dispatch acceptance run'

jobs:
  onednn_test_pt:
    name: onednn_test_pt
    if: >-
      github.repository_owner == 'mengfei25' &&
      github.event.issue.pull_request &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      startsWith(github.event.comment.body, 'make test_pt')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Acknowledge command
        run: |
          gh api -X POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=rocket || true

      - name: Parse command
        id: cmd
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        uses: actions/github-script@v7
        with:
          script: |
            const body = (process.env.COMMENT_BODY || '').trim();
            // Syntax: make test_pt[_ut|_e2e|_smoke] [key=value ...]
            const m = body.match(/^make\s+(test_pt(?:_ut|_e2e|_smoke)?)\b([\s\S]*)$/i);
            if (!m) { core.setOutput('run', 'false'); return; }
            const pattern = m[1].toLowerCase();
            const opts = { python: '3.10', pytorch: 'main', torch_xpu_ops: 'main', target: '', baseline: '' };
            for (const tok of m[2].trim().split(/\s+/).filter(Boolean)) {
              const kv = tok.match(/^([a-zA-Z_]+)=(.+)$/);
              if (kv && kv[1].toLowerCase() in opts) opts[kv[1].toLowerCase()] = kv[2];
            }
            const pr = (await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            })).data;
            const short = (s) => s.slice(0, 7);
            core.setOutput('run', 'true');
            core.setOutput('pattern', pattern);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('target_version', opts.target || short(pr.head.sha));
            core.setOutput('baseline_version', opts.baseline || short(pr.base.sha));
            for (const [k, v] of Object.entries(opts)) core.setOutput(k, v);

      - name: Set dispatch pending status
        if: steps.cmd.outputs.run == 'true'
        env:
          SHA: ${{ steps.cmd.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PATTERN: ${{ steps.cmd.outputs.pattern }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state=pending -f context="${DISPATCH_CONTEXT}" \
            -f target_url="${RUN_URL}" \
            -f description="Dispatching onednn acceptance (${PATTERN})…"

      - name: Dispatch acceptance workflow
        id: dispatch
        if: steps.cmd.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.ONEDNN_DISPATCH_TOKEN }}
          COMPONENT: onednn
          PATTERN: ${{ steps.cmd.outputs.pattern }}
          PYVER: ${{ steps.cmd.outputs.python }}
          PYTORCH: ${{ steps.cmd.outputs.pytorch }}
          TXO: ${{ steps.cmd.outputs.torch_xpu_ops }}
          TARGET: ${{ steps.cmd.outputs.target_version }}
          BASELINE: ${{ steps.cmd.outputs.baseline_version }}
        run: |
          echo "since=$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          gh workflow run "${XPU_OPS_WORKFLOW}" \
            --repo "${XPU_OPS_REPO}" --ref "${XPU_OPS_REF}" \
            -f caller="onednn-pr-${PR_NUMBER}" \
            -f test_pattern="${PATTERN}" \
            -f python="${PYVER}" \
            -f pytorch="${PYTORCH}" \
            -f torch_xpu_ops="${TXO}" \
            -f test_component="${COMPONENT}" \
            -f target_version="${TARGET}" \
            -f baseline_version="${BASELINE}"

      - name: Mirror dispatched jobs as PR statuses
        if: steps.cmd.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.ONEDNN_DISPATCH_TOKEN }}
          SELF_REPO: ${{ github.repository }}
          SHA: ${{ steps.cmd.outputs.head_sha }}
          SINCE: ${{ steps.dispatch.outputs.since }}
          PATTERN: ${{ steps.cmd.outputs.pattern }}
          DISPATCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 1) Locate the run we just dispatched in the other repo.
          run_id=""; run_url=""
          for _ in $(seq 1 20); do
            line=$(gh run list --repo "${XPU_OPS_REPO}" --workflow "${XPU_OPS_WORKFLOW}" \
              --event workflow_dispatch --created ">=${SINCE}" --limit 1 \
              --json databaseId,url --jq '.[0] | "\(.databaseId) \(.url)"' 2>/dev/null || true)
            run_id="${line%% *}"; run_url="${line#* }"
            [ -n "$run_id" ] && [ "$run_id" != "null" ] && break
            run_id=""; sleep 6
          done
          if [ -z "$run_id" ]; then
            gh api -X POST "repos/${SELF_REPO}/statuses/${SHA}" \
              -f state=error -f context="${DISPATCH_CONTEXT}" \
              -f target_url="${DISPATCH_RUN_URL}" \
              -f description="Could not locate dispatched run"
            exit 1
          fi
          gh api -X POST "repos/${SELF_REPO}/statuses/${SHA}" \
            -f state=success -f context="${DISPATCH_CONTEXT}" \
            -f target_url="${run_url}" \
            -f description="Dispatched onednn acceptance (${PATTERN})"

          # 2) Poll the dispatched run's jobs and mirror each as a PR commit
          #    status (context = "torch-xpu-ops: <job name>", deep-linked).
          declare -A last
          map_state() { # <status> <conclusion> -> commit-status state
            [ "$1" != completed ] && { echo pending; return; }
            case "$2" in
              success|skipped|neutral) echo success ;;
              cancelled|timed_out|stale|action_required) echo error ;;
              *) echo failure ;;
            esac
          }
          mirror_once() {
            local rows row j name st cc url state ctx
            rows=$(gh api --paginate "repos/${XPU_OPS_REPO}/actions/runs/${run_id}/jobs" \
              --jq '.jobs[] | @base64' 2>/dev/null || true)
            while IFS= read -r row; do
              [ -n "$row" ] || continue
              j=$(printf '%s' "$row" | base64 -d)
              name=$(printf '%s' "$j" | jq -r '.name')
              st=$(printf '%s' "$j" | jq -r '.status')
              cc=$(printf '%s' "$j" | jq -r '.conclusion // ""')
              url=$(printf '%s' "$j" | jq -r '.html_url')
              state=$(map_state "$st" "$cc")
              ctx="torch-xpu-ops: ${name}"
              if [ "${last[$ctx]:-}" != "$state" ]; then
                gh api -X POST "repos/${SELF_REPO}/statuses/${SHA}" \
                  -f state="$state" -f context="$ctx" -f target_url="$url" \
                  -f description="job ${st}${cc:+ / }${cc}" >/dev/null 2>&1 || true
                last[$ctx]="$state"
              fi
            done <<< "$rows"
          }
          for _ in $(seq 1 700); do   # ~5.8h cap at 30s cadence
            mirror_once
            run_status=$(gh api "repos/${XPU_OPS_REPO}/actions/runs/${run_id}" --jq '.status' 2>/dev/null || echo "")
            [ "$run_status" = completed ] && break
            sleep 30
          done
          mirror_once   # final pass to capture terminal states
